<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const p = params.get("p");
        if (p) {
          const url = window.location.pathname + decodeURIComponent(p);
          window.history.replaceState(null, null, url);
        }
      })();
    </script>
